services:
  postgres:
    container_name: library_database
    image: postgres:14.11
    ports:
      - "3235:5432"
    environment:
      - POSTGRES_USER=ancas19
      - POSTGRES_PASSWORD=P0stgr3s#P4ssw0rd
      - POSTGRES_DB=postgres
    volumes:
      -  db-data:/var/lib/postgresql/data
    networks:
      - app-network
  redis:
    container_name: library_redis
    image: redis:6.2-alpine
    ports:
      - "6584:6379"
    command: /bin/sh -c "redis-server --requirepass $$REDIS_HOST_PASSWORD"
    depends_on:
      - postgres
    environment:
      - REDIS_HOST_PASSWORD=123456
    networks:
      - app-network
  app:
    image: ancas19/docker_library:latest
    container_name: library_app
    ports:
      - "9090:9090"
    depends_on:
      - postgres
    networks:
      - app-network
    environment:
      - APP_PORT=9090
      - CLOUDINARY_API_KEY=423598284112566
      - CLOUDINARY_API_SECRET=CmB-sogq0VGJMNx_kNBimwBK2VA
      - CLOUDINARY_CLOUD_NAME=diil54oei
      - CONTEXT_PATH=/api/library
      - EMAIL_PASSWORD=hyby vajn uyxv aakv
      - EMAIL_USER=andres.cmonsalve@gmail.com
      - HIBERNATE_DDL_AUTO=none
      - JWT_EXPIRATION=8
      - JWT_
      - LOGGING_LEVEL=INFO
      - POSTGRES_DB=postgres
      - POSTGRES_HOST=library_database
      - POSTGRES_PASSWORD=P0stgr3s#P4ssw0rd
      - POSTGRES_PORT=5432
      - POSTGRES_USER=ancas19
      - REDIS_HOST=library_redis
      - REDIS_PASS=123456
      - REDIS_PORT=6379
      - REDIS_TIMEOUT=5000
      - SHOW_SQL=true
networks:
  app-network:
    driver: bridge
volumes:
  db-data:
    driver: local