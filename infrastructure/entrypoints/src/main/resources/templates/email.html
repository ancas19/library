<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            color: #333;
        }
        .email-container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header img {
            width: 150px;
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #777;
            margin-top: 20px;
        }
        .footer p {
            margin: 5px 0;
        }
    </style>
</head>
    <body>
        <div class="email-container">
        <div class="header">
            <img src="https://res.cloudinary.com/diil54oei/image/upload/fl_preserve_transparency/v1730683847/My%20Brand/library_x94jvi.jpg" alt="Library App Logo">
        </div>

        <!-- Content Fragment -->
            <div th:utext="${body}"></div>

        <div class="footer">
            <p>&copy; 2024 Library App. All rights reserved.</p>
            <p>123 Library Street, City, State, ZIP</p>

        </div>
     </body>
</html>
